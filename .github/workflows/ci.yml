name: CI

on:
  push:
    branches: [main, master]
  pull_request:

jobs:
  ci:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Install deps
        run: npm install --no-audit --no-fund

      - name: Typecheck
        run: npm run typecheck

      - name: Build base sandbox image
        run: docker build -t ivanatoms/base:node22 -f docker/base-node22.Dockerfile docker/

      - name: Test (unit + docker integration)
        run: npm test

      - name: Build app
        run: npm run build